<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aubade</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Primary">
        <div class="sidebar__brand-row">
          <div class="sidebar__wordmark" aria-label="Aubade">
            <svg class="sidebar__mark" aria-hidden="true" viewBox="0 0 28 28">
              <path d="M13.25 2.5c-4.85 1.2-8.5 5.55-8.5 10.75 0 5.3 3.75 9.7 8.75 10.8-1.9-2.55-2.9-6.15-2.9-10.8 0-4.55.95-8.15 2.65-10.75Z" />
              <path d="M17.15 4.25c3.65 1.35 6.1 4.8 6.1 9 0 4.05-2.3 7.55-5.75 9.05-1.85-1.8-2.8-4.85-2.8-9.05 0-4.15.82-7.15 2.45-9Z" />
            </svg>
            <div class="sidebar__brand">Aubade</div>
          </div>
          <button class="icon-button" type="button" aria-label="Collapse sidebar">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <rect x="3.25" y="4" width="13.5" height="12" rx="2" />
              <path d="M11 4v12" />
              <path d="m8.25 8-2 2 2 2" />
            </svg>
          </button>
        </div>

        <nav class="sidebar__nav" aria-label="Main navigation">
          <a class="sidebar__nav-item sidebar__nav-item--selected" href="#home" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.25 9.25 10 3.5l6.75 5.75" />
              <path d="M5.25 8.25v7.5h3.5v-4.5h2.5v4.5h3.5v-7.5" />
            </svg>
            <span>Home</span>
          </a>
          <a class="sidebar__nav-item" href="#search">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="8.75" cy="8.75" r="5.25" />
              <path d="m12.75 12.75 3.5 3.5" />
            </svg>
            <span>Search</span>
          </a>
          <a class="sidebar__nav-item" href="#browse">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <rect x="3.5" y="3.5" width="5" height="5" rx="1" />
              <rect x="11.5" y="3.5" width="5" height="5" rx="1" />
              <rect x="3.5" y="11.5" width="5" height="5" rx="1" />
              <rect x="11.5" y="11.5" width="5" height="5" rx="1" />
            </svg>
            <span>Browse</span>
          </a>
          <a class="sidebar__nav-item" href="#albums">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="6.5" />
              <circle cx="10" cy="10" r="1.75" />
              <path d="M10 3.5v2" />
            </svg>
            <span>Albums</span>
          </a>
          <a class="sidebar__nav-item" href="#artists">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="10" cy="6.75" r="3" />
              <path d="M4.75 16.25c.75-3 2.5-4.5 5.25-4.5s4.5 1.5 5.25 4.5" />
            </svg>
            <span>Artists</span>
          </a>
          <a class="sidebar__nav-item" href="#library">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M4.25 4.5v11" />
              <path d="M8 4.5v11" />
              <path d="M11.75 4.5v11" />
              <path d="m15.25 5 1.25 10" />
            </svg>
            <span>Your Library</span>
          </a>
        </nav>

        <div class="sidebar__rule" aria-hidden="true"></div>

        <section class="sidebar__pinned" aria-labelledby="pinned-heading">
          <div class="sidebar__section-row">
            <h2 id="pinned-heading">Pinned</h2>
            <button class="icon-button" type="button" aria-label="Add pinned item">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M10 4.5v11" />
                <path d="M4.5 10h11" />
              </svg>
            </button>
          </div>

          <div class="sidebar__pinned-list">
            <a class="pinned-item" href="#liked-songs">
              <span class="pinned-item__art" aria-hidden="true">
                <svg aria-hidden="true" viewBox="0 0 20 20">
                  <path d="M10 16s-5.25-3.2-5.25-7.1A3.05 3.05 0 0 1 10 6.75a3.05 3.05 0 0 1 5.25 2.15C15.25 12.8 10 16 10 16Z" />
                </svg>
              </span>
              <span class="pinned-item__copy">
                <span class="pinned-item__title">Liked Songs</span>
                <span class="pinned-item__meta">Pinned - Playlist</span>
              </span>
            </a>
          </div>
        </section>

        <footer class="sidebar__footer">Aubade</footer>
      </aside>

      <main class="main">
        <header class="top-bar">
          <div class="top-bar__left">
            <button class="top-bar__btn" type="button" aria-label="Go back">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M12 4.5 6.5 10 12 15.5" />
              </svg>
            </button>
            <button class="top-bar__btn" type="button" aria-label="Go forward">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="m8 4.5 5.5 5.5L8 15.5" />
              </svg>
            </button>
          </div>
          <div class="top-bar__right">
            <button class="top-bar__btn" type="button" aria-label="Notifications">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M10 2.5a4.5 4.5 0 0 0-4.5 4.5c0 2.5-.75 4.25-1.75 5.25h12.5C15.25 11.25 14.5 9.5 14.5 7a4.5 4.5 0 0 0-4.5-4.5Z" />
                <path d="M8.25 12.25v.5a1.75 1.75 0 0 0 3.5 0v-.5" />
              </svg>
            </button>
            <button class="top-bar__avatar" type="button" aria-label="Account">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <circle cx="10" cy="7.5" r="2.75" />
                <path d="M5.25 16c.5-2.5 2.25-3.75 4.75-3.75s4.25 1.25 4.75 3.75" />
              </svg>
            </button>
          </div>
        </header>

        <div class="content-frame">
          <div class="content-frame__inner">
            <!-- Placeholder to demonstrate scrolling -->
            <div class="placeholder-block"></div>
          </div>
        </div>
      </main>

      <!-- ── Player bar ─────────────────────────────────────── -->
      <footer class="player glass-bar" aria-label="Now playing">
        <!-- LEFT: cover, track info, action buttons -->
        <div class="player__left">
          <div class="player__cover" aria-hidden="true"></div>
          <div class="player__track-info">
            <span class="player__title">the cure</span>
            <span class="player__artist">Olivia Rodrigo</span>
          </div>
          <button class="player__icon-btn" type="button" aria-label="Expand now playing">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="m6 12.5 4-5 4 5" />
            </svg>
          </button>
          <button class="player__icon-btn" type="button" aria-label="Like">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M10 16s-5.25-3.2-5.25-7.1A3.05 3.05 0 0 1 10 6.75a3.05 3.05 0 0 1 5.25 2.15C15.25 12.8 10 16 10 16Z" />
            </svg>
          </button>
          <button class="player__icon-btn" type="button" aria-label="Share">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="14.5" cy="5" r="2.25" />
              <circle cx="5.5" cy="10" r="2.25" />
              <circle cx="14.5" cy="15" r="2.25" />
              <path d="m7.5 8.75 5-2.5M7.5 11.25l5 2.5" />
            </svg>
          </button>
        </div>

        <!-- CENTRE: transport + scrubber -->
        <div class="player__centre">
          <div class="player__transport">
            <button class="player__icon-btn" type="button" aria-label="Shuffle">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M3.5 14.5h2.25c1.5 0 2.5-.75 3.5-2.5" />
                <path d="M3.5 5.5h2.25c2.5 0 3.75 2 5.25 5s2.75 4 4.5 4h.75" />
                <path d="M14 12.5l2.25 2-2.25 2" />
                <path d="M12 5.5h4.25" />
                <path d="M14 3.5l2.25 2-2.25 2" />
              </svg>
            </button>
            <button class="player__icon-btn" type="button" aria-label="Previous">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M5.5 4.5v11" />
                <path d="M15.5 5 8 10l7.5 5V5Z" />
              </svg>
            </button>
            <button class="player__play-btn" type="button" aria-label="Play">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M7.5 4.5v11l8-5.5Z" fill="currentColor" stroke="none" />
              </svg>
            </button>
            <button class="player__icon-btn" type="button" aria-label="Next">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M14.5 4.5v11" />
                <path d="M4.5 5 12 10l-7.5 5V5Z" />
              </svg>
            </button>
            <button class="player__icon-btn" type="button" aria-label="Repeat">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M4 7.5h12l-2.25-2.25" />
                <path d="M16 12.5H4l2.25 2.25" />
              </svg>
            </button>
          </div>
          <div class="player__scrubber">
            <span class="player__time">3:48</span>
            <div class="player__track-bar">
              <div class="player__track-fill" style="width: 62%"></div>
              <div class="player__track-knob" style="left: 62%"></div>
            </div>
            <span class="player__time">4:57</span>
          </div>
        </div>

        <!-- RIGHT: utility icons + volume slider -->
        <div class="player__right">
          <button class="player__icon-btn" type="button" aria-label="Cast">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.5 13.5v2h2" />
              <path d="M3.5 10a5.5 5.5 0 0 1 5.5 5.5" />
              <path d="M3.5 6.5a9 9 0 0 1 9 9" />
              <path d="M7 4.5h8.5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H14" />
            </svg>
          </button>
          <button class="player__icon-btn" type="button" aria-label="Queue">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.5 5.5h10" />
              <path d="M3.5 10h7" />
              <path d="M3.5 14.5h5" />
              <path d="M14.5 10v6" />
              <path d="M11.5 13h6" />
            </svg>
          </button>
          <button class="player__icon-btn" type="button" aria-label="Volume">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.5 8v4h2.75l3.25 3V5L6.25 8H3.5Z" />
              <path d="M12.5 7a4 4 0 0 1 0 6" />
              <path d="M14.25 5a7 7 0 0 1 0 10" />
            </svg>
          </button>
          <div class="player__vol-bar">
            <div class="player__vol-fill" style="width: 70%"></div>
            <div class="player__vol-knob" style="left: 70%"></div>
          </div>
          <button class="player__icon-btn" type="button" aria-label="Mini player">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <rect x="3.5" y="3.5" width="13" height="9" rx="1.5" />
              <rect x="9.5" y="14" width="7" height="5" rx="1" />
            </svg>
          </button>
          <button class="player__icon-btn" type="button" aria-label="Fullscreen">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M4 7.5V4.5h3" />
              <path d="M16 7.5V4.5h-3" />
              <path d="M4 12.5v3h3" />
              <path d="M16 12.5v3h-3" />
            </svg>
          </button>
        </div>
      </footer>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
