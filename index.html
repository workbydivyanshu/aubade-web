<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aubade</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="Primary">
        <div class="sidebar__brand-row">
          <div class="sidebar__wordmark" aria-label="Aubade">
            <svg class="sidebar__mark" aria-hidden="true" viewBox="0 0 28 28">
              <path d="M13.25 2.5c-4.85 1.2-8.5 5.55-8.5 10.75 0 5.3 3.75 9.7 8.75 10.8-1.9-2.55-2.9-6.15-2.9-10.8 0-4.55.95-8.15 2.65-10.75Z" />
              <path d="M17.15 4.25c3.65 1.35 6.1 4.8 6.1 9 0 4.05-2.3 7.55-5.75 9.05-1.85-1.8-2.8-4.85-2.8-9.05 0-4.15.82-7.15 2.45-9Z" />
            </svg>
            <div class="sidebar__brand">Aubade</div>
          </div>
          <button class="icon-button" type="button" aria-label="Collapse sidebar">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <rect x="3.25" y="4" width="13.5" height="12" rx="2" />
              <path d="M11 4v12" />
              <path d="m8.25 8-2 2 2 2" />
            </svg>
          </button>
        </div>

        <nav class="sidebar__nav" aria-label="Main navigation">
          <a class="sidebar__nav-item sidebar__nav-item--selected" href="#home" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M3.25 9.25 10 3.5l6.75 5.75" />
              <path d="M5.25 8.25v7.5h3.5v-4.5h2.5v4.5h3.5v-7.5" />
            </svg>
            <span>Home</span>
          </a>
          <a class="sidebar__nav-item" href="#search">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="8.75" cy="8.75" r="5.25" />
              <path d="m12.75 12.75 3.5 3.5" />
            </svg>
            <span>Search</span>
          </a>
          <a class="sidebar__nav-item" href="#browse">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <rect x="3.5" y="3.5" width="5" height="5" rx="1" />
              <rect x="11.5" y="3.5" width="5" height="5" rx="1" />
              <rect x="3.5" y="11.5" width="5" height="5" rx="1" />
              <rect x="11.5" y="11.5" width="5" height="5" rx="1" />
            </svg>
            <span>Browse</span>
          </a>
          <a class="sidebar__nav-item" href="#albums">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="6.5" />
              <circle cx="10" cy="10" r="1.75" />
              <path d="M10 3.5v2" />
            </svg>
            <span>Albums</span>
          </a>
          <a class="sidebar__nav-item" href="#artists">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <circle cx="10" cy="6.75" r="3" />
              <path d="M4.75 16.25c.75-3 2.5-4.5 5.25-4.5s4.5 1.5 5.25 4.5" />
            </svg>
            <span>Artists</span>
          </a>
          <a class="sidebar__nav-item" href="#library">
            <svg aria-hidden="true" viewBox="0 0 20 20">
              <path d="M4.25 4.5v11" />
              <path d="M8 4.5v11" />
              <path d="M11.75 4.5v11" />
              <path d="m15.25 5 1.25 10" />
            </svg>
            <span>Your Library</span>
          </a>
        </nav>

        <div class="sidebar__rule" aria-hidden="true"></div>

        <section class="sidebar__pinned" aria-labelledby="pinned-heading">
          <div class="sidebar__section-row">
            <h2 id="pinned-heading">Pinned</h2>
            <button class="icon-button" type="button" aria-label="Add pinned item">
              <svg aria-hidden="true" viewBox="0 0 20 20">
                <path d="M10 4.5v11" />
                <path d="M4.5 10h11" />
              </svg>
            </button>
          </div>

          <div class="sidebar__pinned-list">
            <a class="pinned-item" href="#liked-songs">
              <span class="pinned-item__art" aria-hidden="true">
                <svg aria-hidden="true" viewBox="0 0 20 20">
                  <path d="M10 16s-5.25-3.2-5.25-7.1A3.05 3.05 0 0 1 10 6.75a3.05 3.05 0 0 1 5.25 2.15C15.25 12.8 10 16 10 16Z" />
                </svg>
              </span>
              <span class="pinned-item__copy">
                <span class="pinned-item__title">Liked Songs</span>
                <span class="pinned-item__meta">Pinned - Playlist</span>
              </span>
            </a>
          </div>
        </section>

        <footer class="sidebar__footer">Aubade</footer>
      </aside>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
