# The suites run here for the same reason they run on every commit locally:
# a check nobody runs is a check that does not exist.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install Playwright
        working-directory: test
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox

      # No dev server step: run.js serves the repository itself.
      - name: Run the suites
        run: node test/run.js

      # A second rendering engine, and the only browser family here that
      # genuinely lacks the File System Access API rather than being told to
      # pretend. Everything but the visualiser runs; that one needs real signal
      # reaching the analyser and cannot be silenced.
      - name: Run them again in Firefox
        run: node test/run.js --engine=firefox
